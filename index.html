<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Music Genre Classifier</title>
  <link rel="stylesheet" href="index.css">
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/meyda/dist/web/meyda.min.js"></script> -->
</head>

<body>
  <div class="viewport">
    <div id="content-container" class="content-container">
      <section class="page page-input">
        <div class="page-input-content">
          <header class="site-name-container">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="64" height="64" rx="12" fill="#1A1A1B" />
              <path
                d="M17.5556 47.6V16.4H23.3333V47.6H17.5556ZM29.1111 58V6H34.8889V58H29.1111ZM6 37.2V26.8H11.7778V37.2H6ZM40.6667 47.6V16.4H46.4444V47.6H40.6667ZM52.2222 37.2V26.8H58V37.2H52.2222Z"
                fill="url(#paint0_linear_2100_1617)" />
              <defs>
                <linearGradient id="paint0_linear_2100_1617" x1="32" y1="58" x2="32" y2="6" gradientUnits="userSpaceOnUse">
                  <stop offset="0.1" stop-color="#ECECEC" />
                  <stop offset="0.2" stop-color="#B1E8EA" />
                  <stop offset="0.3" stop-color="#FE4E41" />
                  <stop offset="0.4" stop-color="#F39191" />
                  <stop offset="0.5" stop-color="#80B9F1" />
                  <stop offset="0.6" stop-color="#B99CF4" />
                  <stop offset="0.7" stop-color="#F2AC89" />
                  <stop offset="0.8" stop-color="#FFD24D" />
                  <stop offset="0.9" stop-color="#4BE59A" />
                  <stop offset="1" stop-color="#DACDFF" />
                </linearGradient>
              </defs>
            </svg>
            <h1 class="site-name">Анализатор жанра</h1>
          </header>
          <div class="file-upload">
            <div class="file-upload__error js-error-output">Ошибка</div>
            <div class="file-upload__drag-area">
              <div class="file-input-label semi-bold-subtext">
                <input id="audio-file-input" type="file" accept="audio/*" class="visually-hidden" />
                <span class="text-default" aria-label="Перетащите или выберите аудиофайл">
                  Перетащите или <span class="visual-link">выберите</span> аудиофайл
                </span>
                <span class="text-hover" aria-hidden="true">Отпустите, чтобы загрузить</span>
              </div>
              <div class="file-upload__preview js-file-preview">
                  <span class="file-upload__name js-input-file-name"></span>
                  <button type="button" class="btn-remove-file js-remove-file semi-bold-subtext" aria-label="Удалить файл">✕</button> 
              </div>
            </div>
          </div>
          <button class="btn btn--run js-run-analysis" disabled>Начать анализ</button>
        </div>
      </section>
      <section class="page page-result">
        <div class="result-top">
          <div class="task-info">
            <p class="task-name">Анализ</p>
            <div class="metadata">
              <p class="name">Неизвестно</p>
              <p class="author-block">
                от <span class="author">Неизвестен</span>
              </p>
            </div>
          </div>
        </div>
        <div class="result-middle">
          <span class="loader hidden"></span>
          <div class="waveform js-waveform-container"></div>
          <div class="bubble-chart"></div>
          <div class="result">
            <span class="label">жанр</span>
            <span class="genre">Обработка...</span>
          </div>
        </div>
        <div class="result-bottom">
          <button class="btn btn--back js-back-trigger">
          <svg class="arrow-icon" fill="#000000" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
            <path d="M26.025 14.496l-14.286-.001 6.366-6.366L15.979 6 5.975 16.003 15.971 26l2.129-2.129-6.367-6.366h14.29z"/>
          </svg>
          На главную</button>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="js/index.js"></script>
</body>

</html>
